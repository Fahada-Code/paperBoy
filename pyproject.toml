[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperboy"
version = "0.0.1"
description = "A terminal AI research digest: fetch, rank, summarize, and deliver a daily PDF brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fahad Khan" }]
keywords = ["llm", "arxiv", "digest", "cli", "summarization"]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "reportlab>=4.0",
]

# The `local` GPU serving path (Phase 3). Heavy, GPU-specific, and optional:
# Ollama users never need these. Install with:  pip install -e ".[local]"
# (torch must come from the CUDA index: pip install torch --index-url
#  https://download.pytorch.org/whl/cu124)
[project.optional-dependencies]
local = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Fahada-Code/paperBoy"
Repository = "https://github.com/Fahada-Code/paperBoy"

[project.scripts]
paperboy = "paperboy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
