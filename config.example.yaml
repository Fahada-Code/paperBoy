# paperBoy configuration — copy to config.yaml and edit.
# This drives what gets fetched, how it's ranked, and how the digest is written.

# Topics you care about. Used in Phase 2 to rank fetched items by relevance
# (embedding similarity against these phrases). Be specific.
topics:
  - "LLM inference optimization and serving"
  - "quantization and model compression"
  - "retrieval-augmented generation"
  - "distributed systems and databases"

# Where to pull from. Only arXiv is wired up first (free, no auth).
sources:
  arxiv:
    enabled: true
    categories: ["cs.LG", "cs.CL", "cs.DC"]
    max_results: 60      # fetched per run before ranking
  hackernews:
    enabled: false
  github_trending:
    enabled: false

# How many of the top-ranked items make it into the digest.
top_n: 8

# Relevance floor. Papers scoring below this (max cosine similarity to any of
# your topics) are dropped, so a quiet day yields a short/empty brief instead of
# irrelevant filler. 0.0 = off. Calibrate it: run once, read the per-paper scores
# paperBoy prints, then set this just under your "clearly relevant" papers.
min_score: 0.0

# LLM relevance gate. After embedding ranking, ask the LLM to judge each
# shortlisted paper keep/drop with a reason - embeddings are blunt at the margin
# and let through papers that merely share ML vocabulary. Costs a few extra short
# LLM calls per run. true = on (recommended). Override per run with --no-filter.
llm_filter: true

# Model for the relevance judge. Empty = reuse the summary model (backend.model
# below). The judge benefits from a sharper reasoner, so you can point it at a
# larger local model than the summarizer (same Ollama host) without paying that
# cost on every summary, e.g.  judge_model: "qwen2.5:14b"
judge_model: ""

# Use the learned re-ranker (data_dir/reranker.json) for scoring when it has been
# trained; otherwise fall back to raw embedding cosine. Train it with
# `paperboy train-reranker` once labels accumulate. Override per run: --no-reranker.
use_reranker: true

# Where feedback/labels accumulate (gitignored, user-local). Every relevance-gate
# verdict is logged here as a weak label; `paperboy rate` adds gold good/bad
# labels. These are the training data for the re-ranker (and a future fine-tune);
# `paperboy labels` prints the running count, `paperboy train-reranker` learns.
data_dir: "./data"

# LLM backend. Phase 1 wires these up; "ollama" is the easy no-GPU default,
# "local" is the RTX 4050 showcase path, "hosted" is a cloud API.
backend:
  kind: ollama          # one of: ollama | local | hosted
  model: "llama3.2:3b"  # small + fast; upgrade to "qwen2.5:7b" for sharper summaries (needs ~5GB VRAM)
  host: "http://localhost:11434"
  timeout: 300          # seconds; first call cold-loads the model (~75s on a laptop GPU)

# Output.
output:
  format: pdf           # pdf | markdown
  dir: "./digests"
