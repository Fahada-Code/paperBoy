name: Daily digest

# Runs the pipeline on a schedule using Ollama on the runner's CPU (no GPU, no
# API key, no always-on machine). The PDF is uploaded as a downloadable artifact.
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC ~= 7am Edmonton (MDT) / 6am (MST)
  workflow_dispatch: {}      # allow manual "Run workflow" from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # the 7B judge on CPU is the slow part; see runs.jsonl in the artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install paperBoy (base deps only — Ollama backend, no GPU extras)
        run: python -m pip install -e .

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      # Cache the pulled model blobs so cron runs don't re-download them every
      # time. The models are fixed, so a static key is fine; bump the -vN suffix
      # to bust the cache. On a hit the later "ollama pull" is a fast no-op that
      # just verifies the manifest, so keeping the pull stays correct either way.
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.2-3b-qwen2.5-7b-nomic-embed-text-v2

      # Carry data/ (seen.json, run metrics, labels) between cron runs so the
      # digest doesn't repeat papers. Caches are immutable, so save under a fresh
      # key each run and restore the newest one by prefix.
      - name: Restore paperBoy history
        uses: actions/cache@v4
        with:
          path: data
          key: paperboy-data-${{ github.run_id }}
          restore-keys: paperboy-data-

      - name: Serve, pull models, and generate the digest
        run: |
          # Start the Ollama server and keep it alive for this whole step.
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version >/dev/null && break
            sleep 1
          done
          ollama pull llama3.2:3b
          ollama pull qwen2.5:7b
          ollama pull nomic-embed-text
          # Small model writes the summaries; the 7B is the relevance judge. In
          # eval-judge the 3B judge missed ~half the relevant papers the 7B kept
          # (74% vs 92% agreement on logged labels). CPU cores don't batch like a
          # GPU, so no parallel calls here.
          sed -e 's/^judge_model: ""/judge_model: "qwen2.5:7b"/' \
              -e 's/^llm_workers: 4/llm_workers: 1/' \
              config.example.yaml > config.ci.yaml
          grep -q '^judge_model: "qwen2.5:7b"' config.ci.yaml  # fail loudly if the sed missed
          paperboy run --config config.ci.yaml --top 6

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest
          path: |
            digests/
            data/runs.jsonl
          if-no-files-found: error
